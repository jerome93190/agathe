name: Deploy to GitHub Pages

# Publie l'application (site statique) sur GitHub Pages.
# Prérequis : Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch: # permet aussi un lancement manuel depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # active GitHub Pages automatiquement si nécessaire

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # le site est à la racine du dépôt

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
